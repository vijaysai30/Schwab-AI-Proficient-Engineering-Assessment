spring.application.name=Waitlist

# The starter already depends on H2. Keep a single in-memory database and let Spring JDBC
# manage transactions. LOCK_TIMEOUT gives concurrent enrollment attempts time to wait on
# the offering row lock instead of failing immediately.
spring.datasource.url=jdbc:h2:mem:waitlist;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=15000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=32
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
